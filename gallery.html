<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lesotho tourism website - destinations, accommodation, gallery and booking.">
  <title>Gallery | MalotiTrails Lesotho</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="logo.png" alt="MalotiTrails logo" class="brand-logo">Maloti<span>Trails</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
          <li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
          <button class="btn btn-sm mt-2 mt-lg-0" id="darkBtn" type="button">Dark Mode</button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="banner">
      <h1>Photo Gallery</h1>
      <p>Click on a photo to make it bigger</p>
    </section>

    <section class="container">
      <h2 class="section-title">Pictures of Lesotho</h2>
      <div class="row g-3">
        <div class="col-6 col-md-4">
          <img src="high.jpg" class="gallery-img" alt="High mountain peaks under cloudy sky">
        </div>
        <div class="col-6 col-md-4">
          <img src="water1.jpg" class="gallery-img" alt="Lake and mountain scenery">
        </div>
        <div class="col-6 col-md-4">
          <img src="wild.jpg" class="gallery-img" alt="Waterfall in a green rocky valley">
        </div>
        <div class="col-6 col-md-4">
          <img src="dark.jpg" class="gallery-img" alt="Mountain under a sky full of stars">
        </div>
        <div class="col-6 col-md-4">
          <img src="gold.jpg" class="gallery-img" alt="Sunlight over a mountain valley">
        </div>
        <div class="col-6 col-md-4">
          <img src="path.jpg" class="gallery-img" alt="Path through green trees">
        </div>
      </div>
    </section>

    <!-- modal for the big picture -->
    <div class="modal fade" id="photoModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="modalTitle">Gallery Photo</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="modalImage" src="" alt="">
            <p id="modalCaption" class="mt-2 mb-0"></p>
            <p id="imageCount" class="mb-0"><small></small></p>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-gold" id="prevBtn">&laquo; Previous</button>
            <button type="button" class="btn btn-gold" id="nextBtn">Next &raquo;</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="container">
      <p>
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="accommodation.html">Accommodation</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </p>
      <p>&copy; 2026 MalotiTrails Lesotho </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
